name: Monitor Drawdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pyyaml tickflow pytest pycryptodome matplotlib

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          JISILU_USERNAME: ${{ secrets.JISILU_USERNAME }}
          JISILU_PASSWORD: ${{ secrets.JISILU_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GUORN_COOKIE: ${{ secrets.GUORN_COOKIE }}
          CONFIG_PATH: ./config.yaml
        run: python monitor_drawdown.py

      - name: Commit Guorn archive if changed
        run: |
          if [ -z "$(git status --porcelain -- data_archive/guorn_meta)" ]; then
            echo "guorn archive unchanged or missing, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data_archive/guorn_meta
            git commit -m "chore: archive guorn meta snapshot"
            git push
          fi
