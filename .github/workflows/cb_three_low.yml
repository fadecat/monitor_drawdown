name: CB Three-Low Email

on:
  schedule:
    # GitHub Actions 使用 UTC；UTC 07:30 = Asia/Shanghai 15:30（A股收盘后）
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

jobs:
  cb-three-low-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pycryptodome matplotlib pytest

      - name: Send CB Three-Low email
        env:
          JISILU_USERNAME: ${{ secrets.JISILU_USERNAME }}
          JISILU_PASSWORD: ${{ secrets.JISILU_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python send_cb_three_low_email.py

      - name: Detect state file changes
        id: state_changes
        run: |
          if [ -n "$(git status --porcelain -- data_state/cb_three_low_state.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit state file
        if: steps.state_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_state/cb_three_low_state.json
          git commit -m "chore: update cb three low state"
          git push
