name: Monitor Jisilu Calendar

on:
  workflow_dispatch:

jobs:
  monitor-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pytest

      - name: Run Jisilu calendar monitor
        env:
          CALENDAR_WEBHOOK_URL: ${{ secrets.CALENDAR_WEBHOOK_URL }}
          CONFIG_PATH: ./config.yaml
        run: python monitor_jisilu_calendar.py
